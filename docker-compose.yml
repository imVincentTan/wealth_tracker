services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wealth}
      POSTGRES_DB: ${POSTGRES_DB:-wealth_tracker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wealth} -d ${POSTGRES_DB:-wealth_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      # Always the in-network db hostname. .env's DATABASE_URL points at
      # 127.0.0.1 (for host-native runs) and must not leak into the container.
      DATABASE_URL: postgresql://wealth:wealth@db:5432/wealth_tracker
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "43127:43127"
    depends_on:
      - api

volumes:
  pgdata:
